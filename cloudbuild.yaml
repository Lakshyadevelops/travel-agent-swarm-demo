# Build the demo image and push it to Artifact Registry.
#
#   gcloud builds submit --project ks-opm-project \
#     --substitutions _TAG=$(git rev-parse --short HEAD) .
#
# _IMAGE's repository is created by Terraform (deploy/hosting). Two tags per
# build: the commit (what Terraform pins) and "latest" (convenience only).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
substitutions:
  _IMAGE: us-west1-docker.pkg.dev/ks-opm-project/travel-swarm/app
  _TAG: dev
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
